---
name: lint

'on':
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs-chef-io'


jobs:
  cookstyle-supermarket:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: ruby/setup-ruby@v1
      with:
        working-directory: src/supermarket
        ruby-version: 4.0.10
        bundler-cache: true
    - uses: r7kamura/rubocop-problem-matchers-action@v1 # this shows the failures in the PR
    - name: run cookstyle
      run: bundle exec cookstyle
      working-directory: src/supermarket
  cookstyle-fieri:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: ruby/setup-ruby@v1
      with:
        working-directory: src/supermarket/engines/fieri
        ruby-version: 4.0.10
        bundler-cache: true
    - uses: r7kamura/rubocop-problem-matchers-action@v1 # this shows the failures in the PR
    - name: run cookstyle
      run: bundle exec cookstyle --ignore-parent-exclusion
      working-directory: src/supermarket/engines/fieri
