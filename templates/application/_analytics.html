{% if shell.onetrust %}{% if shell.onetrust_id.is_some() %}
  <script src="https://cdn.cookielaw.org/consent/{{ shell.onetrust_id.as_deref().unwrap_or_default() }}/otSDKStub.js" charset="UTF-8" data-domain-script="{{ shell.onetrust_id.as_deref().unwrap_or_default() }}" nonce="{{ shell.nonce }}"></script>
{% endif %}{% endif %}

{% if shell.gtag %}
  <!-- GTag conditional -->
  <script type="text/javascript" nonce="{{ shell.nonce }}">
    var oneTrustHelper = (function () {
      function evalGTagScript() {
        var gtScript = document.getElementById("GTagScript");
        gtScript.type = "text/javascript";
        gtScript.classList.remove("optanon-category-2");
        eval(gtScript.innerHTML);
      };
      return {
        gtagFallback: function () {
          console.warn('OneTrust not loaded.');
          if (document.readyState !== 'loading') {
            evalGTagScript();
          } else {
            document.addEventListener('readystatechange', function () {
              if (document.readyState === 'interactive') {
                evalGTagScript();
              }
            });
          };
        }
      };
    })();
  </script>
{% endif %}

{% if shell.gtag %}
  {% if shell.google_analytics_id.is_some() %}
  <!-- Global site tag (gtag.js) - Google Analytics -->
  <script src="https://www.googletagmanager.com/gtag/js?id={{ shell.google_analytics_id.as_deref().unwrap_or_default() }}," nonce="{{ shell.nonce }}"></script>

  <script nonce="{{ shell.nonce }}">
    window.dataLayer = window.dataLayer || [];
    function gtag(){window.dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', '{{ shell.google_analytics_id.as_deref().unwrap_or_default() }}');
  </script>
  {% endif %}
{% endif %}
