<div class="page nobg">
  <h1 class="title">
    New Group
  </h1>
  <form action="/groups" accept-charset="UTF-8" method="post">
    <input type="hidden" name="authenticity_token" value="{{ shell.csrf }}" autocomplete="off" />
    <input type="text" name="group[name]" id="group_name" placeholder="Group Name" />
    <input type="submit" name="commit" value="Create Group" class="button primary radius" data-disable-with="Create Group" />
  </form>
</div>
