# Phase 3 read UI: guest and signed-in pages, every search/sort/tab variant,
# unknown ids, robots and the atom feed. Run with:
#   harness/bin/replay harness/corpus/ui_read.yml
- name: welcome
  method: GET
  path: /
- name: robots
  method: GET
  path: /robots.txt
- name: documentation
  method: GET
  path: /documentation
- name: dashboard guest
  method: GET
  path: /dashboard
