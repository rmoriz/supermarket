[package]
name = "supermarket-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
description = "Wire-compatible Rust port of the Chef Supermarket Rails application"
license = "AGPL-3.0-only"

[dependencies]
aes-gcm = "0.10"
axum = { version = "0.8", features = ["macros", "multipart"] }
base64 = "0.22"
md5 = "0.7"
cadence = "1.5"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
flate2 = "1"
form_urlencoded = "1"
futures = "0.3"
hex = "0.4"
num-bigint = "0.4"
hmac = "0.12"
pbkdf2 = { version = "0.12", features = ["hmac"] }
rand = "0.8"
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
regex = "1"
rsa = { version = "0.9", features = ["sha2"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_urlencoded = "0.7"
sha1 = "0.10"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio", "chrono", "json", "uuid", "macros"] }
tar = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["compression-gzip", "limit", "timeout", "trace", "set-header", "request-id", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
askama = { version = "0.16", features = ["config"] }
pulldown-cmark = "0.13.6"
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "builder", "hostname", "pool", "rustls-tls"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

[profile.release]
lto = "thin"
codegen-units = 1
